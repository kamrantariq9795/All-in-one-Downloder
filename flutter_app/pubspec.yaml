name: omni_downloader
description: "All-in-One High Quality Video Downloader for Android (No Watermark)"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  dio: ^5.4.1
  path_provider: ^2.1.2
  permission_handler: ^11.3.0
  flutter_spinkit: ^5.2.0
  cached_network_image: ^3.3.1
  fluttertoast: ^8.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
